# Documentation + optional gftools builder path.
# Canonical public build (source of truth):
#   python scripts/build_candidate.py --from-ufo
# which runs fontmake on this designspace, then finalize (names/OFL/STAT) + package_gf.
# Maintainer regenerate (overwrites sources/masters):
#   python scripts/build_candidate.py --from-provenance
sources:
  - AkhilNotes.designspace
familyName: Akhil Notes
axisOrder:
  - slnt
  - wght
buildStatic: true
buildVariable: true
