name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile from committed UFOs (no provenance)
        env:
          PYTHONUTF8: "1"
        run: python scripts/build_candidate.py --from-ufo

      - name: OTS + instantiate + upright/italic parity
        env:
          PYTHONUTF8: "1"
        run: python scripts/audit_final.py

      - name: HarfBuzz feature harness
        env:
          PYTHONUTF8: "1"
        run: python scripts/qa_features.py

      - name: Install Fontspector
        run: |
          set -e
          VER=1.9.1
          ASSET="fontspector-${VER}-x86_64-unknown-linux-gnu"
          curl -fsSL -o /tmp/fontspector.tar.gz \
            "https://github.com/fonttools/fontspector/releases/download/fontspector-v${VER}/${ASSET}.tar.gz"
          mkdir -p /tmp/fontspector
          tar -xzf /tmp/fontspector.tar.gz -C /tmp/fontspector
          BIN=$(find /tmp/fontspector -name fontspector -type f | head -n1)
          sudo cp "$BIN" /usr/local/bin/fontspector
          sudo chmod +x /usr/local/bin/fontspector
          fontspector --version

      - name: Fontspector googlefonts profile on VF pair
        working-directory: ofl/akhilnotes
        run: |
          fontspector -p googlefonts --skip-network \
            --json ../../qa/fontspector/ci.json \
            "AkhilNotes[wght].ttf" "AkhilNotes-Italic[wght].ttf"
          python - <<'PY'
          import json, sys
          from pathlib import Path
          s = json.loads(Path("../../qa/fontspector/ci.json").read_text())["summary"]
          print(s)
          if s.get("FAIL", 0) or s.get("FATAL", 0) or s.get("ERROR", 0):
              sys.exit(1)
          PY
